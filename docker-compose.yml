services:
  postgres:
    image: postgres:17
    container_name: language-learning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: language_learning
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - language_learning_pgdata:/var/lib/postgresql/data

volumes:
  language_learning_pgdata:
