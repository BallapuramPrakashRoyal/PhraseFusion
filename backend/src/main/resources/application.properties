spring.application.name=language-learning-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/language_learning}
spring.datasource.username=${DB_USERNAME:app_user}
spring.datasource.password=${DB_PASSWORD:app_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
